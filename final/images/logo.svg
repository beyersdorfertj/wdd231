<svg xmlns="http://www.w3.org/2000/svg" height="48px" viewBox="0 -960 960 960" width="48px">
    <!-- Sonne (Sunset Orange) - statisch -->
    <g id="sun">
        <circle cx="190" cy="-800" r="100" fill="#e07a3f" />
        <path
            d="M100-920 100-930 M100-790 100-800 M35-860 25-860 M165-860 175-860 M53-913 46-920 M147-807 154-800 M53-807 46-800 M147-913 154-920"
            stroke="#e07a3f" stroke-width="3" stroke-linecap="round" />
    </g>

    <!-- Segel (Dreieck links - Warm Sand) - animiert -->
    <g id="sail-left">
        <path d="m129-420 301-438v438H129Zm115-60h126v-187L244-480Z" fill="#e0c9a6" />
    </g>

    <!-- Segel (rechter Bereich - Ocean Blue) - animiert -->
    <g id="sail-right">
        <path
            d="M514-420q19-60 27.5-120.5T550-670q0-66-8.5-128.5T514-918q47 19 101 66.5T716-737q47 67 79 148.5T830-420H514Zm75-60h175q-17-87-62.5-168T602-782q5 30 6.5 59t1.5 53q0 46-6.5 99T589-480Z"
            fill="#1e5a7d" />
    </g>

    <!-- Boot (mittlerer Bereich - Ocean Blue) - animiert -->
    <g id="boat">
        <path
            d="M360-196q-34 0-65-18.5T240-261q-14 14-33.5 27.5T169-213q-29-18-54-53.5T82-340h796q-8 38-33 73.5T791-213q-18-7-37.5-20.5T720-261q-24 28-55 46.5T600-196q-34 0-65-18.5T480-261q-24 28-55 46.5T360-196Z"
            fill="#1e5a7d" />
    </g>

    <!-- Wellen (unterer Bereich - Dark Gray) - animiert -->
    <g id="waves-bottom">
        <path
            d="M80-40v-60h40q32 0 61.5-10.5T240-149q29 28 59 38.5t61 10.5q32 0 61.5-10.5T480-149q29 28 59 38.5t61 10.5q32 0 61.5-10.5T720-149q29 28 58.5 38.5T840-100h40v60h-40q-29 0-59.5-8.5T720-80q-30 23-60.5 31.5T600-40q-29 0-59.5-8.5T480-80q-30 23-60.5 31.5T360-40q-29 0-59.5-8.5T240-80q-30 23-60.5 31.5T120-40H80Z"
            fill="#2c3e50" />
    </g>

    <style>
        @keyframes sway-sail-left {
        0%, 100% { transform: rotate(0deg); transform-origin: 430px -858px; }
        50% { transform: rotate(-2deg); transform-origin: 430px -858px; }
        }

        @keyframes sway-sail-right {
        0%, 100% { transform: rotate(0deg); transform-origin: 514px -918px; }
        50% { transform: rotate(2deg); transform-origin: 514px -918px; }
        }

        @keyframes boat-float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-3px); }
        }

        @keyframes wave-float-bottom {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-2px); }
        }

        #sail-left {
        animation: sway-sail-left 3s ease-in-out infinite;
        }

        #sail-right {
        animation: sway-sail-right 3.5s ease-in-out infinite;
        }

        #boat {
        animation: boat-float 2s ease-in-out infinite;
        }

        #waves-bottom {
        animation: wave-float-bottom 2.5s ease-in-out infinite 0.3s;
        }
    </style>
</svg>