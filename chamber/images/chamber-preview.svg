<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
    <!-- Background -->
    <rect width="1200" height="630" fill="#315b7c" />

    <!-- Decorative shapes -->
    <circle cx="100" cy="100" r="80" fill="#b4a497" opacity="0.3" />
    <circle cx="1100" cy="530" r="100" fill="#f5b1c3" opacity="0.3" />

    <!-- Main content area -->
    <rect x="100" y="120" width="1000" height="390" rx="20" fill="#fff" opacity="0.95" />

    <!-- Header section -->
    <rect x="100" y="120" width="1000" height="120" rx="20" fill="#b4a497" />
    <text x="600" y="190" font-family="Arial, sans-serif" font-size="56" font-weight="bold"
        fill="#315b7c" text-anchor="middle">Friedrichsdorf</text>
    <text x="600" y="225" font-family="Arial, sans-serif" font-size="42" fill="#484846"
        text-anchor="middle">Chamber of Commerce</text>

    <!-- Business icons row -->
    <g transform="translate(200, 300)">
        <!-- Building icon -->
        <rect x="0" y="20" width="60" height="80" fill="#315b7c" rx="5" />
        <rect x="10" y="30" width="15" height="15" fill="#f5b1c3" />
        <rect x="35" y="30" width="15" height="15" fill="#f5b1c3" />
        <rect x="10" y="55" width="15" height="15" fill="#f5b1c3" />
        <rect x="35" y="55" width="15" height="15" fill="#f5b1c3" />
        <rect x="20" y="80" width="20" height="20" fill="#b4a497" />
    </g>

    <g transform="translate(400, 300)">
        <!-- Handshake representation -->
        <circle cx="30" cy="50" r="30" fill="#315b7c" />
        <rect x="15" y="45" width="30" height="15" fill="#f5b1c3" />
    </g>

    <g transform="translate(600, 300)">
        <!-- Growth chart -->
        <rect x="0" y="70" width="15" height="30" fill="#315b7c" />
        <rect x="20" y="55" width="15" height="45" fill="#315b7c" />
        <rect x="40" y="35" width="15" height="65" fill="#f5b1c3" />
    </g>

    <g transform="translate(800, 300)">
        <!-- Network/community -->
        <circle cx="30" cy="40" r="12" fill="#315b7c" />
        <circle cx="10" cy="70" r="12" fill="#315b7c" />
        <circle cx="50" cy="70" r="12" fill="#f5b1c3" />
        <line x1="30" y1="52" x2="15" y2="62" stroke="#484846" stroke-width="3" />
        <line x1="30" y1="52" x2="45" y2="62" stroke="#484846" stroke-width="3" />
    </g>

    <!-- Tagline -->
    <text x="600" y="440" font-family="Arial, sans-serif" font-size="32" fill="#484846"
        text-anchor="middle">Connecting Businesses • Building Community</text>

    <!-- Location -->
    <text x="600" y="485" font-family="Arial, sans-serif" font-size="24" fill="#484846"
        text-anchor="middle">📍 Friedrichsdorf, Germany</text>

    <!-- Footer info -->
    <text x="600" y="580" font-family="Arial, sans-serif" font-size="28" fill="#fff"
        text-anchor="middle">WDD 231 Chamber Directory Project</text>
</svg>